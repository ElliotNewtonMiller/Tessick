# Tessick and PostgreSQL. Copy .env.example to .env, fill it in, then:
#   docker compose up -d
# Tessick is then on http://localhost:3001 (or TESSICK_PORT). See docs/deployment.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tessick
      POSTGRES_USER: tessick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessick -d tessick"]
      interval: 5s
      timeout: 5s
      retries: 10

  tessick:
    build: .
    image: tessick:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tessick:${POSTGRES_PASSWORD}@db:5432/tessick
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRETS_KEY: ${SECRETS_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WEBHOOK_ALLOW_LOCAL: ${WEBHOOK_ALLOW_LOCAL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Evidence files: on the evidence-data volume, unless EVIDENCE_STORAGE=s3 (see .env.example).
      EVIDENCE_STORAGE: ${EVIDENCE_STORAGE:-local}
      EVIDENCE_DIR: /data/evidence
      EVIDENCE_MAX_FILE_MB: ${EVIDENCE_MAX_FILE_MB:-200}
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
      EVIDENCE_S3_REGION: ${EVIDENCE_S3_REGION:-}
      EVIDENCE_S3_ENDPOINT: ${EVIDENCE_S3_ENDPOINT:-}
      EVIDENCE_S3_PREFIX: ${EVIDENCE_S3_PREFIX:-}
      EVIDENCE_S3_FORCE_PATH_STYLE: ${EVIDENCE_S3_FORCE_PATH_STYLE:-false}
      EVIDENCE_S3_SSE: ${EVIDENCE_S3_SSE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - evidence-data:/data/evidence
    ports:
      - "${TESSICK_PORT:-3001}:3001"

volumes:
  db-data:
  evidence-data:
