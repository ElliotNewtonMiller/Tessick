# Typecheck, test and build on every push and pull request, then check the production build
# against a real PostgreSQL (the test suite uses an in-memory one), that the Docker image builds
# and the demo (docker-compose.demo.yml) starts with its project. Pushes to main then publish the
# image to ghcr.io/elliotnewtonmiller/tessick, for amd64 and arm64.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: Production build on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tessick
          POSTGRES_USER: tessick
          POSTGRES_PASSWORD: tessick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessick -d tessick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tessick:tessick@localhost:5432/tessick
      JWT_SECRET: ci-only-jwt-secret-not-for-real-use-0123456789
      ADMIN_PASSWORD: CiAdminPassword123!
      EVIDENCE_DIR: /tmp/tessick-evidence
      PORT: 3001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the server
        run: |
          NODE_ENV=production npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/api/v1/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Load the demo data through the API
        run: npx tsx apps/server/scripts/report-demo.ts
        env:
          TESSICK_URL: http://localhost:3001
          TESSICK_PASSWORD: CiAdminPassword123!
      - name: Restart against the same database
        run: |
          pkill -f "[n]ode dist/server.js"
          sleep 2
          NODE_ENV=production npm start > server2.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/api/v1/health && break; sleep 1; done
          curl -sf http://localhost:3001/ | grep -q '<div id="root">'
          TOKEN=$(curl -sf -X POST http://localhost:3001/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"CiAdminPassword123!"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -H "authorization: Bearer $TOKEN" http://localhost:3001/api/v1/projects | grep -q 'Report Demo'
      - name: Server log
        if: always()
        run: cat server.log server2.log 2>/dev/null || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tagged as the published image, so the demo compose file uses this build.
      - run: docker build -t ghcr.io/elliotnewtonmiller/tessick:latest .
      - name: Start the demo
        run: docker compose -f docker-compose.demo.yml up -d --wait --wait-timeout 180
      - name: The demo shows its sign-in and has its project
        run: |
          curl -sf http://127.0.0.1:3001/api/v1/instance | grep -q '"password":"tessick-demo-admin"'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:3001/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"tessick-demo-admin"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -H "authorization: Bearer $TOKEN" http://127.0.0.1:3001/api/v1/projects | grep -q 'Report Demo'
      - name: Demo log
        if: always()
        run: docker compose -f docker-compose.demo.yml logs tessick

  publish:
    name: Publish the Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, postgres, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/elliotnewtonmiller/tessick
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Tessick
            org.opencontainers.image.description=Self-hosted test case management: a modern replacement for TestLink.
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
